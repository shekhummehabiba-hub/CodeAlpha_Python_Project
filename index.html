<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Python Chatbot</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="chat-container">

        <!-- Header -->

        <div class="chat-header">

            <div>
                <h1>🤖 PyBot</h1>
                <p>Python Chatbot</p>
            </div>

            <span class="status">
                ● Online
            </span>

        </div>


        <!-- Chat Messages -->

        <div id="chatBox" class="chat-box">

            <div class="message bot-message">

                <div class="avatar">
                    🤖
                </div>

                <div class="message-content">
                    Hello! 👋<br>
                    I am PyBot. How can I help you?
                </div>

            </div>

        </div>


        <!-- Input Area -->

        <div class="input-area">

            <input
                type="text"
                id="userInput"
                placeholder="Type your message..."
                autocomplete="off"
            >

            <button onclick="sendMessage()">
                Send
            </button>

        </div>


        <button class="clear-button"
                onclick="clearChat()">

            🗑️ Clear Chat

        </button>

    </div>


    <script src="{{ url_for('static', filename='script.js') }}">
    </script>

</body>

</html>
